risks:
  findings:
    - finding_id: FIND-01-UNDISPATCHABLE-WINDOW
      severity: critical
      status: resolved
      description: >-
        #169 (merged 2026-08-20T06:46:21Z) shipped an unquoted ": " inside a
        YAML scalar in .claude/agents/security-reviewer.md's description
        field. This is a mapping separator in YAML, so the frontmatter
        failed to parse, and the dispatcher silently dropped the
        security-reviewer agent definition -- attempting to dispatch it
        returned "Agent type 'security-reviewer' not found". Security review
        was impossible on this project from #169's merge until #170's merge
        (2026-08-20T14:39:16Z), roughly 8 hours. No other PR merged in that
        window (verified: PR #168 merged before, at 04:53:43Z; PR #170 is
        the next merge, at 14:39:16Z).
      owner: platform-service-owner
      reference: "PR #170"
    - finding_id: FIND-02-THREE-LAYERS-MISSED-IT
      severity: major
      status: resolved
      description: >-
        Three green CI jobs, 9 passing tests, three rounds of orchestrator
        mutation testing, and an independent critic returning SHIP all
        missed the FIND-01 defect on #169. Each of these treated the changed
        file as text (diff review, lint, test assertions written before the
        defect existed) rather than loading it as YAML data -- none actually
        parsed the frontmatter. The defect was found only by attempting to
        dispatch the agent and observing the dispatcher's own error. #170
        and #171 close this specific gap by making project_status.py parse
        every agent definition with yaml.safe_load and FAIL loudly, then
        wiring that into CI --strict.
      owner: platform-service-owner
      reference: "PR #170; PR #171"
    - finding_id: FIND-03-ZERO-INDEPENDENT-REVIEW
      severity: major
      status: open
      description: >-
        Zero independent human review is recorded on PR #169, #170, or #171
        (gh api pulls/<n>/reviews returns [] for each); author == mergedBy
        on all three. The same holds for #141, #150, #155, #157, and #166,
        checked as comparison points. Main's branch protection has no
        required_pull_request_reviews key; required_status_checks.contexts
        is exactly the three CI jobs, and enforce_admins is true -- merging
        requires green CI and nothing else.
      owner: platform-service-owner
      reference: "gh api repos/storm-credit/agentforge/branches/main/protection; gh pr view reviews for the PRs named above"
    - finding_id: FIND-04-REQUIRED-REVIEWS-UNENFORCED
      severity: minor
      status: open
      description: >-
        required_reviews is declared in harness/agents/specialists.yaml (7
        role entries) and 12 harness/work-orders/*.yaml files, but has zero
        consumers in any .py/.yml/.mjs file in the repository (grep
        verified). Every specialist role's and accepted Work Order's
        required_reviews clause is currently unenforceable prose.
      owner: platform-service-owner
      reference: "REQUIRED-REVIEWS-CONSUMER-GREP verification above"
    - finding_id: FIND-05-STALE-WORKTREE-LOCKED-GAP
      severity: minor
      status: open
      description: >-
        The stale-worktree check added in #169
        (_check_stale_worktrees) FAILs only for a directory under
        .claude/worktrees/ that is unregistered AND non-empty. The
        documented real failure mode in this project's own incident history
        is a REGISTERED-but-LOCKED worktree left behind by a failed
        dispatch, which shadows live files identically to an unregistered
        one but is only reported (PASS with a note naming the lock state),
        not failed. Independent critic verdict on this check: MARGINAL.
      owner: platform-service-owner
      reference: "harness/tools/project_status.py::_check_stale_worktrees docstring"
    - finding_id: FIND-06-ROLE-SPLIT-IS-TOOL-LIST-ONLY-NOT-CONTRACT-LEVEL
      severity: major
      status: open
      description: >-
        harness/agents/specialists.yaml declares 10 roles and has no
        security-reviewer role. Both .claude/agents/security-reviewer.md and
        .claude/agents/security-implementer.md bind to the same
        agent_role_id: security-trust-architect, and that contract's own
        required_reviews entry names reviewer_roles: [security-trust-architect]
        for a trust_boundary_or_security_change -- at contract level, the same
        role reviews itself. The separation of duties this package's scope
        describes (a 4-tool review-only role plus a 5-tool implementer role)
        is real and enforced, but only at the .claude/agents/*.md tools: list
        level: security-reviewer.md has no Edit/Write tool, so a dispatched
        security-reviewer genuinely cannot edit files. Nothing in
        specialists.yaml itself distinguishes reviewer from implementer, so a
        session could still claim to "act as" security-trust-architect and
        both implement and review under the one contract. Closing this
        would mean splitting agent_role_id in specialists.yaml, which #169,
        #170, and #171 deliberately do not do (see scope.excluded above).
      owner: platform-service-owner
      reference: "harness/agents/specialists.yaml (10 roles, no security-reviewer entry, security-trust-architect required_reviews clause); .claude/agents/security-reviewer.md:8; .claude/agents/security-implementer.md:8"
  residual_risks:
    - risk_id: RISK-01-TODO-FIXME-COUPLING
      description: >-
        Wiring `project_status.py --strict` into CI (#171) also makes the
        pre-existing TODO/FIXME sweep (_scan_todo_fixme) a hard CI-failing
        constraint over apps/api/app, apps/web/app, and eval/harness -- not
        only the agent-definition-integrity check this package is about. A
        future PR that merely adds a TODO/FIXME comment in those trees will
        now fail CI's Backend job for a reason unrelated to agent-definition
        integrity, unless the author already knows about this coupling.
      severity: medium
      owner: platform-service-owner
      accepted: false
      review_condition: "Confirm with platform-service-owner whether the TODO/FIXME hard-fail is intended CI policy or an unreviewed side effect of #171's --strict wiring; document explicitly if intended."
    - risk_id: RISK-02-NAME-FILENAME-MATCH-UNDETERMINED
      description: >-
        Whether the Claude Code dispatcher requires an agent definition's
        frontmatter name: field to match its filename is undetermined -- no
        check was added for this across #169/#170/#171, deliberately. If a
        mismatch is itself silently mishandled by the dispatcher in a way
        this package's checks do not catch, that remains unverified.
      severity: low
      owner: platform-service-owner
      accepted: false
      review_condition: "Run a dedicated dispatch experiment (deliberately mismatched name:/filename pair) and record the result."
  secret_redaction_review: >-
    No secrets, tokens, or confidential source text are included in this
    package; all references are public PR/commit metadata, public workflow
    run URLs, and repository file paths.
  rollback_or_disable_plan: >-
    Each of #169 (83ab5b5), #170 (cbd8a43), #171 (cc1b26a) is an individually
    revertable commit on main. Reverting #171 alone removes the CI --strict
    gate but leaves the fixed frontmatter in place (safe). Reverting #170
    without also reverting #169 would reintroduce the parse-breaking
    description line while removing the new parser, restoring the
    undetected-undispatchable state described in FIND-01/FIND-02 -- #169 and
    #170 must only ever be reverted together, in that order (#170 first,
    then #169), to avoid silently recreating the exact defect this package
    documents.
limitations:
  - limitation_id: LIMIT-01-NO-REQUIRED-PR-REVIEW
    classification: security
    description: >-
      Main branch protection has no required_pull_request_reviews gate;
      merging requires only the three named CI status checks plus
      enforce_admins=true. Any contributor, including the sole author, can
      merge without another human ever reviewing the diff -- as literally
      happened for #169, #170, and #171.
    impact: >-
      Real, reproducible: this exact chain (including the PR that introduced
      a critical dispatch-breaking defect) merged with zero recorded human
      reviews.
    owner: platform-service-owner
    blocker: false
    resolution_trigger: "Repository owner decides to enable required_pull_request_reviews on main, or formally records acceptance of this as residual risk."
  - limitation_id: LIMIT-02-REQUIRED-REVIEWS-FIELD-UNENFORCED
    classification: operations
    description: >-
      required_reviews is declared as a contract field in
      harness/agents/specialists.yaml and 12 accepted Work Order files, but
      no code in the repository reads or enforces it.
    impact: >-
      A reviewer or the product owner could reasonably believe review is
      gated by this field when it is currently unenforceable prose.
    owner: platform-service-owner
    blocker: false
    resolution_trigger: "A future harness slice implements a required_reviews consumer, or the field is formally retired from the schema/contracts."
  - limitation_id: LIMIT-03-LOCKED-WORKTREE-NOT-FAILED
    classification: operations
    description: >-
      _check_stale_worktrees only FAILs for unregistered-and-populated
      directories. A registered-but-locked worktree -- the documented real
      failure mode in this project's incident history -- is reported
      (PASS, with lock state named) but not failed.
    impact: >-
      An agent using name-based find without the documented exclusions could
      still silently edit a shadowed copy inside a registered-but-locked
      worktree without this check catching it.
    owner: platform-service-owner
    blocker: false
    resolution_trigger: "A future slice decides whether locked-registered worktrees should FAIL, given the independent critic's MARGINAL verdict on the current design."
  - limitation_id: LIMIT-04-NAME-FILENAME-MATCH-UNKNOWN
    classification: evaluation
    description: >-
      Whether the dispatcher requires an agent definition's name: field to
      match its filename is undetermined; no check exists for this.
    impact: "This package's frontmatter-validity gate cannot claim to catch a name/filename mismatch defect, because whether the dispatcher itself even cares about the mismatch is unverified."
    owner: platform-service-owner
    blocker: false
    resolution_trigger: "A dedicated dispatch experiment is run and recorded."
  - limitation_id: LIMIT-05-TODO-FIXME-CI-COUPLING
    classification: code
    description: >-
      #171's --strict wiring also makes the pre-existing TODO/FIXME sweep a
      hard CI-failing constraint across apps/api/app, apps/web/app, and
      eval/harness, coupled to the agent-definition-integrity fix this
      package is about.
    impact: "A future PR adding an unrelated TODO/FIXME in those trees will fail CI's Backend job for a reason this package does not otherwise cover."
    owner: platform-service-owner
    blocker: false
    resolution_trigger: "Confirmed and documented as intended CI policy, or narrowed to exclude the TODO/FIXME sweep from --strict."
  - limitation_id: LIMIT-07-SECURITY-ROLE-SPLIT-IS-TOOL-LIST-ONLY
    classification: security
    description: >-
      The security-reviewer / security-implementer split enforces separation
      of duties only through each .claude/agents/*.md file's tools: list.
      harness/agents/specialists.yaml has no security-reviewer role -- both
      dispatch aliases bind to the same agent_role_id: security-trust-architect,
      and that contract's required_reviews clause names
      security-trust-architect as its own reviewer for
      trust_boundary_or_security_change.
    impact: >-
      A reader of specialists.yaml alone would not discover that review and
      implementation are separated for security changes; the guarantee exists
      only in the two wrapper files' tool lists, not in the authoritative
      contract. See FIND-06-ROLE-SPLIT-IS-TOOL-LIST-ONLY-NOT-CONTRACT-LEVEL.
    owner: platform-service-owner
    blocker: false
    resolution_trigger: "A future slice splits agent_role_id in harness/agents/specialists.yaml into distinct reviewer/implementer contract entries, or the product owner formally accepts tool-list-only enforcement as sufficient."
  - limitation_id: LIMIT-06-NO-INDEPENDENT-REVIEW-OF-THIS-PACKAGE
    classification: organization
    description: >-
      This Evidence Package itself has not been reviewed by an independent
      reviewer (qa-eval-specialist / independent-release-governor) as the
      guide's Independence quality rule requires; it was assembled by a
      single agent from the PRs' own artifacts and the task brief that
      commissioned it.
    impact: >-
      This package documents review absence on its underlying chain rather
      than demonstrating independent acceptance of either the chain or
      itself. Its own status is deliberately evidence_ready, not accepted,
      for this reason.
    owner: pm-orchestrator
    blocker: true
    resolution_trigger: "An independent-release-governor or the accountable human reviews this package and records an outcome with independent: true."
