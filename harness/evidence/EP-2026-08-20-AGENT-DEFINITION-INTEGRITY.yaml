scope:
  problem: >-
    CLAUDE.md rule 7-d (Local Action Space) required every reasoning node's
    directly selectable Agent/Tool/Skill/MCP set to be <= 5, but the
    security-reviewer agent role carried 6 tools while being the repository's
    only mechanism to independently review authorization/ACL/RBAC/injection-
    guard/secret-handling/audit-integrity changes. Separately, the
    .claude/worktrees/ stale-copy hazard (a name-based-find trap that had
    already caused a real incident) was documented in prose only, with no
    executable check.
  intended_outcome: >-
    Split security-reviewer into a 4-tool review-only role plus a new 5-tool
    security-implementer role (bringing every node to <= 5), and add an
    executable, CI-wired check that flags unregistered-but-populated
    .claude/worktrees/ directories -- without regressing the actual ability
    to dispatch security review.
  issue_refs:
    - "PR #169"
    - "PR #170"
    - "PR #171"
  requirement_ids:
    - CLAUDE.md-7-d-local-action-space
    - current-state.md-freeze-exception-item-11-bounded-harness-enforcement
  adr_refs: []
  included:
    - "Split security-reviewer into review-only (4 tools) + security-implementer (5 tools) roles (#169)"
    - "Add executable _check_stale_worktrees() drift check + tests (#169)"
    - "Fix the invalid-YAML description line that made security-reviewer.md undispatchable, and add YAML frontmatter validation (_parse_agent_frontmatter) to project_status.py so an unparseable agent definition FAILs instead of counting as wired (#170)"
    - "Wire `project_status.py --strict` into CI's Backend (ruff + pytest) job (#171)"
  excluded:
    - "Editing harness/agents/specialists.yaml (explicitly not touched across all three PRs)"
    - "Any apps/api or apps/web product/runtime code change (none of the three PRs touch apps/)"
    - "Enabling required_pull_request_reviews on main branch protection"
    - "Making the registered-but-locked stale-worktree case a FAIL (independent critic verdict: MARGINAL; left as report-only)"
    - "Verifying whether the dispatcher requires an agent definition's name: field to match its filename (deliberately not checked)"
  acceptance_criteria:
    - "CI green (3 required jobs: Backend, Frontend, E2E) on each PR head"
    - "harness/tools/tests test count is 0 pre-#169 (the directory did not exist), rises to 9 at #169 (which creates the suite), rises to 15 at #170 (frontmatter-parsing tests), and stays 15 through #171"
    - "`project_status.py --strict` exits 0 on main after #171"
    - "Reintroducing the original ': '-in-description YAML defect causes the exact command CI runs to exit 1 and name the offending file, on both pre-#171 main and the #171 branch head"
    - "Dispatching the security-reviewer agent type actually succeeds after #170 (not merely: its frontmatter parses)"
  prohibited_actions:
    - production_change_without_explicit_authority
    - commit_secrets
    - bypass_artifact_or_dependency_scanning
    - claim_target_environment_evidence_from_local_compose_or_mock
  affected_trust_boundaries:
    - "agent-dispatch capability for the security-reviewer role"
    - "main-branch merge gate (what CI does and does not catch before merge)"
  affected_data_classifications:
    - internal
