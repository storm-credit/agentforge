[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-api"
version = "0.1.0"
description = "Agent Forge FastAPI service"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pypdf>=6.13,<7.0",
    "python-docx>=1.2,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "qdrant-client>=1.11,<2.0",
    "minio>=7.2,<8.0",
    "pypdf>=6.13.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff==0.15.20",
    "jsonschema>=4.23,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit selection so CI can't silently inherit a new ruff release's
# expanded defaults (root cause of the 2026-07-25 CI break: ruff 0.16.0
# widened its default rule set from E4/E7/E9/F to also include B/I/UP/
# BLE/ISC, and the loose ruff>=0.7,<1.0 pin let CI pick up 0.16.x while
# local dev stayed on 0.15.x). This select list codifies the rule set the
# codebase already passed under the pre-0.16 defaults, plus bugbear (B)
# minus B008.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    # FastAPI's dependency-injection idiom intentionally calls Depends()/
    # Query() in argument defaults (`db: Session = Depends(get_db)`); this
    # is the documented, pervasive pattern throughout the API, not a bug.
    "B008",
]

[tool.setuptools.packages.find]
include = ["app*"]
